<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduMind AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f7f6fb;--panel:#fff;--ink:#1d1b2e;--mute:#6b6880;--line:#e5e2f0;--accent:#6c4cf1;--accent2:#12b3a8;--user:#6c4cf1;--userink:#fff;--bot:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121c;--panel:#1c1a2a;--ink:#ecebf5;--mute:#9a97b3;--line:#2d2a42;--accent:#8f78ff;--accent2:#3fd0c5;--user:#5b3fe0;--userink:#fff;--bot:#1c1a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13121c;--panel:#1c1a2a;--ink:#ecebf5;--mute:#9a97b3;--line:#2d2a42;--accent:#8f78ff;--accent2:#3fd0c5;--user:#5b3fe0;--userink:#fff;--bot:#1c1a2a;color-scheme:dark}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{display:flex;height:100%}
aside{width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 16px 12px}
.brand h1{margin:0;font-size:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;color:var(--mute);font-size:12px}
nav{overflow-y:auto;padding:4px 8px;flex:1}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent);color:#fff}
.side-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.side-foot button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--ink);font-size:18px;cursor:pointer}
header b{font-size:16px}header span{color:var(--mute);font-size:13px}
#feed{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:780px;margin:0 auto}
.hero{text-align:center;margin-top:8vh}
.hero h2{font-size:28px;margin:0 0 6px}
.hero p{color:var(--mute);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chips button:hover{border-color:var(--accent)}
.msg{display:flex;margin:12px 0}
.msg.u{justify-content:flex-end}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--bot);overflow-wrap:anywhere}
.msg.u .bub{background:var(--user);color:var(--userink);border-color:transparent}
.bub pre{background:rgba(127,127,160,.15);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:13px}
.bub code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.bub img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.tools{margin-top:6px}
.tools button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:12px;padding:2px 6px}
.dock{padding:10px 16px 14px;background:var(--bg)}
.box{max-width:780px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 8px}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:140px;padding:8px 4px}
.ib{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:6px 8px;border-radius:10px}
.ib:hover{background:var(--bg)}.ib.rec{color:#e5484d}
.send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;font:inherit}
.send:disabled{opacity:.5}
#att{max-width:780px;margin:0 auto 6px;font-size:12px;color:var(--mute)}
.dia{background:#fff;border-radius:10px;padding:6px;margin-bottom:8px;overflow-x:auto}.dia img{max-width:100%;margin:0}
.note{max-width:780px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--mute)}
@media(max-width:760px){aside{position:fixed;z-index:20;top:0;bottom:0;left:-270px;width:260px;transition:left .2s;padding-top:env(safe-area-inset-top,0px)}aside.open{left:0}header .menu{display:block}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><h1>EduMind AI</h1><p>One AI. Everything you need.</p></div>
  <nav id="nav"></nav>
  <div class="side-foot"><button id="newChat">＋ New chat</button><button id="theme">◐ Theme</button></div>
</aside>
<main>
  <header><button class="menu" id="menu">☰</button><b id="mTitle">AI Chat</b><span id="mDesc"></span></header>
  <div id="feed"><div class="wrap" id="log"></div></div>
  <div class="dock">
    <div id="att"></div>
    <div class="box">
      <input type="file" id="file" hidden accept="image/*,.txt,.md,.csv">
      <button class="ib" id="attach" title="Attach image or text file">📎</button>
      <button class="ib" id="mic" title="Voice input" hidden>🎤</button>
      <textarea id="inp" rows="1" placeholder="Ask anything…"></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <div class="note">EduMind AI can make mistakes. Check important information.</div>
  </div>
</main>
</div>
<script>
const MODULES=[
 {id:"chat",i:"💬",n:"AI Chat",d:"Ask anything",p:"You are EduMind AI, a friendly, accurate assistant for students, teachers and everyone. Reply in the language the user writes in.",ex:["Explain photosynthesis simply","Give me a 7-day study plan","What is machine learning?"]},
 {id:"image",i:"🖼️",n:"Image Recognition",d:"Identify objects",p:"You are EduMind Image AI. Identify and explain what is in the attached image in a clear, educational way. If no image is attached, ask the user to attach one.",ex:["What is in this picture?"]},
 {id:"doc",i:"📄",n:"PDF / DOCX / Text",d:"Read and summarize",p:"You are EduMind Document AI. Summarize, explain and answer questions about the attached text. If nothing is attached, ask the user to attach a text file or paste content.",ex:["Summarize this document","List the key points"]},
 {id:"research",i:"🔎",n:"Research (Any Topic)",d:"Any domain, PDF report",p:"You are EduMind Research AI. Answer any topic in any domain (science, medicine basics, law basics, business, history, technology, arts and more) with a well-structured report: title, overview, key points, examples, summary. Be honest that you cannot browse live in this version and mention what sources the user should verify.",ex:["Research report on solar vs wind energy","Explain blockchain in depth"]},
 {id:"books",i:"📚",n:"Book References",d:"Academic references",p:"You are EduMind Reference AI. Suggest well-known academic textbooks and references for the topic, with authors and why each helps. Tell the user to verify editions.",ex:["Best books for data structures"]},
 {id:"diagram",i:"🧭",n:"Diagram AI",d:"Diagram image + PDF",p:"You are EduMind Diagram AI. Draw the requested diagram as ONE complete SVG image: start with <svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 600\"> (enlarge the height if needed), a white background rect, rounded labeled boxes in soft colors, arrows with a marker defined in defs, font-family sans-serif, font-size at least 14, no scripts, no external images, text must not overflow its box. Output the SVG first, then 2 to 4 short sentences explaining the diagram in the user's language. Labels inside the SVG should be in the user's language.",ex:["Flowchart of the water cycle","Login process diagram","Parts of a plant cell"]},
 {id:"code",i:"💻",n:"Coding Assistant",d:"Write and debug",p:"You are EduMind Code AI. Write clean, commented code in fenced blocks, explain it simply and help debug errors.",ex:["Python program to reverse a string","Explain recursion"]},
 {id:"study",i:"🎓",n:"Study Assistant",d:"Notes and quizzes",p:"You are EduMind Study AI. Make concise notes, quizzes with answers and syllabus breakdowns suited to the learner's level.",ex:["Make notes on Newton’s laws","Quiz me on the Indian Constitution"]}
];
const PERSONA="You are EduMind AI, an AI assistant created and developed by Ganikadeepika. If anyone asks who created, invented, built or developed you, answer that you are EduMind AI, created by Ganikadeepika. Do not name any underlying AI model or company unprompted. Never claim to be human, and if someone sincerely asks which AI model powers you, say you don’t have details to share about the underlying technology rather than stating something false. ";
const $=s=>document.querySelector(s);
let mod=MODULES[0],hist=[],attach=null,busy=false,sample=null,dict=null,imgOK=true,ctl=null;
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(t){
  const parts=t.split(/```/);
  return parts.map((s,i)=>i%2?"<pre><code>"+esc(s.replace(/^\w*\n/,""))+"</code></pre>":esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>")).join("");
}
function renderNav(){
  $("#nav").innerHTML="";
  MODULES.forEach(m=>{const b=document.createElement("button");b.textContent=m.i+"  "+m.n;if(m===mod)b.className="on";b.onclick=()=>{mod=m;reset();$("#side").classList.remove("open")};$("#nav").appendChild(b)});
}
function reset(){
  hist=[];attach=null;$("#att").textContent="";
  $("#mTitle").textContent=mod.n;$("#mDesc").textContent="· "+mod.d;
  renderNav();
  const log=$("#log");log.innerHTML="";
  const h=document.createElement("div");h.className="hero";
  h.innerHTML="<h2>"+mod.i+" "+mod.n+"</h2><p>"+mod.d+". Start typing or pick an idea.</p>";
  const c=document.createElement("div");c.className="chips";
  mod.ex.forEach(e=>{const b=document.createElement("button");b.textContent=e;b.onclick=()=>{$("#inp").value=e;send()};c.appendChild(b)});
  h.appendChild(c);log.appendChild(h);
}
function add(role,html){
  const log=$("#log");const h=log.querySelector(".hero");if(h)h.remove();
  const m=document.createElement("div");m.className="msg "+(role==="user"?"u":"b");
  const b=document.createElement("div");b.className="bub";b.innerHTML=html;m.appendChild(b);log.appendChild(m);
  $("#feed").scrollTop=1e9;return b;
}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g," code block "));speechSynthesis.speak(u)}catch(e){}}
async function send(){
  const text=$("#inp").value.trim();
  if(busy||(!text&&!attach))return;
  
  let userText=text||"Please analyse the attachment.",imgBlob=null,show=esc(text);
  if(attach){
    if(attach.kind==="text")userText+="\n\n[Attached file: "+attach.name+"]\n"+attach.text.slice(0,30000);
    else{imgBlob=attach.blob;show='<img src="'+attach.url+'" alt="attachment">'+show}
  }
  add("user",show);
  $("#inp").value="";$("#inp").style.height="auto";attach=null;$("#att").textContent="";
  hist.push({role:"user",content:userText});
  const input=hist.map(m=>({role:m.role,content:m.content}));
  const bub=add("bot","Thinking…");busy=true;$("#send").disabled=true;
  try{
    let image=imgBlob?await toB64(imgBlob):null;
    bub.textContent=mod.id==="diagram"?"Drawing your diagram…":"Thinking…";
    const resp=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:mod.p,messages:input,image})});
    if(!resp.ok){const er=new Error("x");er.code=resp.status===429?"rate_limited":"err";throw er}
    const r=await resp.json();
    hist.push({role:"assistant",content:r.text});
    finish(bub,r.text,userText);
  }catch(e){
    hist.pop();
    bub.textContent=e&&e.code==="not_granted"?"Access was declined, so I can’t answer. Try again and allow it.":e&&e.code==="rate_limited"?"Too many requests. Please wait a bit and try again.":"Something went wrong. Please try again.";
  }
  busy=false;$("#send").disabled=false;$("#feed").scrollTop=1e9;
}
function cleanSvg(raw){
  try{
    const d=new DOMParser().parseFromString(raw,"image/svg+xml");
    if(d.querySelector("parsererror"))return null;
    d.querySelectorAll("script,foreignObject,iframe").forEach(n=>n.remove());
    d.querySelectorAll("*").forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/href/i.test(a.name)&&!/^#/.test(a.value)))n.removeAttribute(a.name)}));
    return new XMLSerializer().serializeToString(d.documentElement);
  }catch(e){return null}
}
const svgUrl=s=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
function finish(bub,full,q){
  let svg=null,body=full;
  if(mod.id==="diagram"){
    const m=full.match(/<svg[\s\S]*?<\/svg>/i);
    if(m){svg=cleanSvg(m[0]);body=full.replace(m[0],"").replace(/```(svg|xml)?/g,"").trim()}
  }
  bub.innerHTML="";
  if(svg){const w=document.createElement("div");w.className="dia";const im=document.createElement("img");im.alt="diagram";im.src=svgUrl(svg);w.appendChild(im);bub.appendChild(w)}
  else if(mod.id==="diagram"){body="I couldn’t draw that diagram. Please try again with a little more detail.\n\n"+body}
  const txt=document.createElement("div");txt.innerHTML=md(body);bub.appendChild(txt);
  const t=document.createElement("div");t.className="tools";
  const mk=(label,fn)=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>fn(b);t.appendChild(b)};
  mk("🔊 Listen",()=>speak(body));
  mk("⧉ Copy",b=>{try{navigator.clipboard.writeText(body);b.textContent="Copied"}catch(e){}});
  mk("📄 Download PDF",async b=>{b.textContent="Making PDF…";try{await savePdf(q,body,svg)}catch(e){b.textContent="PDF failed";return}b.textContent="📄 Download PDF"});
  if(svg)mk("⬇ SVG",()=>saveBlob("diagram.svg",new Blob([svg],{type:"image/svg+xml"})));
  bub.appendChild(t);
}
function saveBlob(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function toB64(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok({media_type:f.type||"image/png",data:String(r.result).split(",")[1]});r.readAsDataURL(f)})}
function loadImg(u){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u})}
async function savePdf(q,body,svg){
  if(!window.jspdf)throw new Error("no pdf lib");
  
  const W=794,H=1123,S=2,M=56,LH=24,FONT='15px system-ui,"Noto Sans Tamil","Noto Sans",sans-serif';
  const pdf=new window.jspdf.jsPDF({unit:"pt",format:[W,H]});
  let cv=null,ctx,y;
  const page=()=>{if(cv){pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,W,H);pdf.addPage([W,H])}
    cv=document.createElement("canvas");cv.width=W*S;cv.height=H*S;ctx=cv.getContext("2d");ctx.scale(S,S);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.fillStyle="#16142a";ctx.textBaseline="top";y=M};
  const line=(s,font)=>{if(y+LH>H-M)page();ctx.font=font||FONT;ctx.fillText(s,M,y);y+=LH};
  const wrap=(para,font)=>{ctx.font=font||FONT;let cur="";for(const w of para.split(" ")){const tr=cur?cur+" "+w:w;if(ctx.measureText(tr).width>W-2*M&&cur){line(cur,font);cur=w}else cur=tr}line(cur,font)};
  page();
  ctx.fillStyle="#6c4cf1";line("EduMind AI",'bold 22px system-ui,sans-serif');ctx.fillStyle="#16142a";
  wrap((q||"").slice(0,200),'bold 16px system-ui,"Noto Sans Tamil",sans-serif');y+=8;
  if(svg){
    const im=await loadImg(svgUrl(svg));
    let iw=im.naturalWidth||900,ih=im.naturalHeight||600;
    const sc=Math.min((W-2*M)/iw,620/ih);iw*=sc;ih*=sc;
    if(y+ih>H-M)page();
    ctx.fillStyle="#fff";ctx.fillRect(M,y,iw,ih);ctx.drawImage(im,M,y,iw,ih);ctx.strokeStyle="#ddd";ctx.strokeRect(M,y,iw,ih);y+=ih+16;ctx.fillStyle="#16142a";
  }
  let code=false;
  for(const raw of body.replace(/\*\*/g,"").split("\n")){
    if(raw.trim().startsWith("```")){code=!code;continue}
    if(!raw.trim()){y+=10;continue}
    wrap(raw,code?'13px ui-monospace,Menlo,Consolas,monospace':null);
  }
  pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,W,H);
  saveBlob("edumind-"+mod.id+".pdf",pdf.output("blob"));
}
$("#send").onclick=send;
$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#inp").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"});
$("#newChat").onclick=reset;
$("#menu").onclick=()=>$("#side").classList.toggle("open");
$("#theme").onclick=()=>{const r=document.documentElement;const d=getComputedStyle(r).colorScheme==="dark";r.setAttribute("data-theme",d?"light":"dark");try{localStorage.setItem("em-theme",d?"light":"dark")}catch(e){}};
try{const t=localStorage.getItem("em-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
$("#attach").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(f.type.startsWith("image/")){
    if(!imgOK){$("#att").textContent="Image reading is not available in this view.";return}
    attach={kind:"image",blob:f,url:URL.createObjectURL(f),name:f.name};
  }else{attach={kind:"text",text:await f.text(),name:f.name}}
  $("#att").textContent="📎 "+f.name+" ready";
};
$("#mic").onclick=async()=>{
  if(!dict)return;
  try{await dict.start()}catch(e){}
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){$("#mic").hidden=false;const rec=new SR();rec.interimResults=true;rec.lang="ta-IN";let on=false;
$("#mic").onclick=()=>{if(on){rec.stop();return}try{rec.start()}catch(e){}};
rec.onstart=()=>{on=true;$("#mic").classList.add("rec")};rec.onend=()=>{on=false;$("#mic").classList.remove("rec")};
rec.onresult=e=>{$("#inp").value=[...e.results].map(r=>r[0].transcript).join(" ")}}
reset();
</script>
</body>
</html>
